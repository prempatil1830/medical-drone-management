<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AeroMedical – Hospital dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Manrope:wght@500;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.flow{animation:flow 1.4s linear infinite}
.ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.beat{animation:beat 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.ring,.beat{animation:none}}
@media (max-width:760px){.sheet{top:auto !important;left:12px !important;right:12px !important;bottom:12px !important;width:auto !important}.hud{display:none !important}}
button{cursor:pointer}
button:focus-visible{outline:3px solid #0B1F33;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:100%;height:900px;overflow:hidden;background:#E6ECEE;font-family:'Manrope',sans-serif;color:#0B1F33">

<svg aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">
<rect width="1440" height="900" fill="#E6ECEE"/>
<g fill="#F3F6F7">
<rect x="470" y="90" width="150" height="90" rx="8"/><rect x="650" y="110" width="210" height="70" rx="8"/><rect x="900" y="60" width="120" height="110" rx="8"/>
<rect x="470" y="300" width="120" height="110" rx="8"/><rect x="1120" y="250" width="170" height="100" rx="8"/><rect x="800" y="720" width="170" height="100" rx="8"/><rect x="1010" y="640" width="110" height="80" rx="8"/><rect x="1300" y="470" width="110" height="130" rx="8"/>
</g>
<path d="M1060 900C1120 760 1260 740 1440 770L1440 900Z" fill="#BBDDEB"/>
<ellipse cx="1260" cy="150" rx="140" ry="58" fill="#BBDDEB"/>
<ellipse cx="610" cy="640" rx="130" ry="92" fill="#CFE6D2"/>
<path d="M930 520C990 480 1060 520 1040 580C1020 630 940 630 920 580Z" fill="#D8EBD6"/>
<rect x="1170" y="400" width="110" height="64" rx="30" fill="#D8EBD6"/>
<g fill="none" stroke-linecap="round">
<g stroke="#D3DCE0" stroke-width="16"><path d="M400 760C640 700 900 520 1440 480"/><path d="M520 0C560 220 640 520 700 900"/><path d="M900 0C940 260 1040 420 1100 900"/><path d="M400 420C700 440 1000 380 1440 330"/></g>
<g stroke="#FFFFFF" stroke-width="11"><path d="M400 760C640 700 900 520 1440 480"/><path d="M520 0C560 220 640 520 700 900"/><path d="M900 0C940 260 1040 420 1100 900"/><path d="M400 420C700 440 1000 380 1440 330"/></g>
<g stroke="#FFFFFF" stroke-width="5"><path d="M470 200L1440 240"/><path d="M450 560L1440 640"/><path d="M1220 0L1180 900"/><path d="M780 0L840 900"/></g>
</g>
<g fill="none" stroke-linecap="round">
<path d="M620 610Q704 442 856 364" stroke="#FFFFFF" stroke-width="12"/>
<path d="M620 610Q704 442 856 364" style="stroke:{{accent}}" stroke-width="6"/>
<path d="M856 364Q958 312 1090 300" stroke="#FFFFFF" stroke-width="11" opacity=".9"/>
<path class="flow" d="M856 364Q958 312 1090 300" style="stroke:{{accent}}" stroke-width="5" stroke-dasharray="10 14"/>
</g>
<circle cx="620" cy="610" r="16" fill="#FFFFFF" stroke="#0B1F33" stroke-width="3"/>
<path d="M620 603V617M613 610H627" stroke="#0B1F33" stroke-width="3" stroke-linecap="round"/>
<circle cx="1090" cy="300" r="26" fill="#0B1F33" opacity=".12"/>
<circle cx="1090" cy="300" r="14" fill="#0B1F33"/><circle cx="1090" cy="300" r="5" fill="#FFFFFF"/>
<g font-family="Manrope" font-weight="800" font-size="14" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" fill="#0B1F33">
<text x="620" y="652">Pickup · Lalbagh Clinic</text><text x="1090" y="268">Drop · Patil Clinic</text>
</g>
<g><circle cx="930" cy="580" r="15" fill="#FFFFFF" stroke="#0B1F33" stroke-width="3" stroke-dasharray="5 4"/><circle cx="930" cy="580" r="4" fill="#0B1F33"/>
<text x="930" y="618" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="14" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" fill="#0B1F33">Vaccines · waiting</text></g>
<g transform="translate(856 364)">
<circle class="ring" r="20" style="fill:{{accent}}"/>
<circle r="23" fill="#FFFFFF" style="stroke:{{accent}}" stroke-width="3"/>
<g transform="rotate(-27)"><path d="M-11-11L11 11M-11 11L11-11" stroke="#0B1F33" stroke-width="2.5" stroke-linecap="round"/>
<g fill="#0B1F33"><circle cx="-11" cy="-11" r="4"/><circle cx="11" cy="-11" r="4"/><circle cx="-11" cy="11" r="4"/><circle cx="11" cy="11" r="4"/></g>
<circle r="4" style="fill:{{accent}}"/></g>
</g>
</svg>

<div style="position:absolute;top:24px;left:24px;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 12px;background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(11,31,51,.12)">
<svg aria-hidden="true" width="28" height="28" viewBox="-14 -14 28 28"><path d="M-9-9L9 9M-9 9L9-9" stroke="#0B1F33" stroke-width="2.4" stroke-linecap="round"/><circle cx="-9" cy="-9" r="3.4" fill="#0B1F33"/><circle cx="9" cy="-9" r="3.4" fill="#0B1F33"/><circle cx="-9" cy="9" r="3.4" fill="#0B1F33"/><circle cx="9" cy="9" r="3.4" fill="#0B1F33"/><circle r="3.4" style="fill:{{accent}}"/></svg>
<span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em">AeroMedical</span>
</div>

<div class="hud" style="position:absolute;top:24px;right:24px;display:flex;gap:10px;align-items:center">
<span style="display:flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 8px;background:#fff;border-radius:24px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(11,31,51,.12)"><span style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#0B1F33;color:#fff;font-size:12px;font-weight:800">PC</span>Patil Clinic · Hospital</span>
</div>

<section class="sheet" aria-label="Your requests" style="position:absolute;top:92px;left:24px;width:380px;box-sizing:border-box;padding:24px;background:#fff;border-radius:28px;box-shadow:0 24px 60px rgba(11,31,51,.16),0 2px 6px rgba(11,31,51,.06);display:flex;flex-direction:column;gap:18px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.025em">Your requests</h1><span style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;color:#4A5B6C">PATIL CLINIC</span></div>
<div style="display:flex;gap:8px"><button style="height:36px;padding:0 16px;border:0;border-radius:18px;background:#0B1F33;color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px">All 2</button><button style="height:36px;padding:0 16px;border:2px solid #D5DEE2;border-radius:18px;background:#fff;color:#0B1F33;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px">Active 1</button><button style="height:36px;padding:0 16px;border:2px solid #D5DEE2;border-radius:18px;background:#fff;color:#0B1F33;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px">Pending 1</button></div>
<article style="border:2px solid #0B1F33;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800;font-size:18px">Blood</span><span style="padding:6px 12px;border-radius:12px;background:#DDF3EF;color:#0A6B5E;font-weight:800;font-size:12px;letter-spacing:.06em">IN TRANSIT</span></div>
<div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;color:#4A5B6C">2 units · 1.5 kg · MIS-10DE1C26</div>
<div style="display:flex;align-items:baseline;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800"><span style="font-size:52px;letter-spacing:-.04em;line-height:1">2.3</span><span style="font-size:18px;font-weight:500">min away</span></div>
<div style="height:8px;border-radius:4px;background:#E3EAED"><div style="width:62%;height:8px;border-radius:4px;background:{{accent}}"></div></div>
<button style="height:44px;border:0;border-radius:22px;background:{{accent}};color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:14px">Track live</button>
</article>
<article style="border:2px solid #E3EAED;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800;font-size:18px">Vaccines</span><span style="padding:6px 12px;border-radius:12px;background:#FFF1CC;color:#6B4600;font-weight:800;font-size:12px;letter-spacing:.06em">PENDING</span></div>
<div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;color:#4A5B6C">50 units · 3 kg</div>
<div style="font-size:14px;color:#4A5B6C">Waiting for operator dispatch.</div>
</article>
<button style="height:52px;border:2px solid #0B1F33;border-radius:26px;background:#fff;color:#0B1F33;font-family:'Manrope',sans-serif;font-weight:800;font-size:16px">New request</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D93A1F"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#D93A1F' };
}
}
</script>
</body>
</html>
